<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Jharkhand Forest Teal -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021714" />
      <stop offset="50%" stop-color="#073f3a" />
      <stop offset="100%" stop-color="#0b514a" />
    </linearGradient>

    <!-- Sacred Jharkhand Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e7" />
      <stop offset="25%" stop-color="#f5e2b3" />
      <stop offset="60%" stop-color="#e9c985" />
      <stop offset="85%" stop-color="#c9933b" />
      <stop offset="100%" stop-color="#96641a" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="glow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087f70" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e9c985" stop-opacity="0.3" />
    </linearGradient>

    <!-- Palash Orange Accent -->
    <linearGradient id="palash-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="gold-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#c9933b" flood-opacity="0.4" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background: Premium Rounded Squircle -->
  <rect width="512" height="512" rx="118" fill="url(#bg-grad)" />

  <!-- Outer Elegant Gold Rim -->
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Inner Subtle Ring -->
  <rect x="26" y="26" width="460" height="460" rx="96" fill="none" stroke="url(#glow-grad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Ambient Glow Behind the "S" -->
  <circle cx="256" cy="256" r="160" fill="#087f70" opacity="0.25" filter="url(#soft-glow)" />
  <circle cx="256" cy="256" r="90" fill="#e9c985" opacity="0.12" filter="url(#soft-glow)" />

  <!-- Setu Arch Lines (Background Bridge Geometry) -->
  <path d="M 120 370 C 180 280, 332 280, 392 370" fill="none" stroke="#e9c985" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="4 6" />
  <path d="M 120 142 C 180 232, 332 232, 392 142" fill="none" stroke="#e9c985" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="4 6" />

  <!-- THE STYLISH "S" — BRIDGE EMBLEM -->
  <g filter="url(#gold-shadow)">
    <!-- Main Fluid Calligraphic S Body -->
    <path
      d="M 342 146
         C 372 176, 376 216, 342 248
         C 310 278, 202 264, 170 294
         C 136 326, 140 366, 170 396
         C 200 426, 260 426, 308 402
         C 328 392, 344 380, 356 368
         C 362 362, 370 364, 370 374
         C 366 392, 344 416, 314 432
         C 254 464, 174 462, 134 422
         C 94 382, 92 324, 136 280
         C 176 240, 276 256, 310 224
         C 344 192, 338 154, 308 124
         C 278 94, 218 94, 176 118
         C 156 128, 142 140, 130 152
         C 124 158, 116 156, 116 146
         C 120 128, 142 104, 172 88
         C 232 56, 302 58, 342 98
         Z"
      fill="url(#gold-grad)"
    />

    <!-- Setu Bridge Central Chord (Connecting problem to solution) -->
    <path
      d="M 160 300
         C 210 240, 302 272, 352 212"
      fill="none"
      stroke="url(#palash-grad)"
      stroke-width="7"
      stroke-linecap="round"
      opacity="0.9"
    />

    <!-- Top Innovation Node (Academic / Idea Spark) -->
    <circle cx="342" cy="116" r="14" fill="url(#palash-grad)" />
    <circle cx="342" cy="116" r="7" fill="#ffffff" />

    <!-- Bottom Grassroots Node (Citizen Anchor) -->
    <circle cx="170" cy="396" r="14" fill="url(#gold-grad)" />
    <circle cx="170" cy="396" r="7" fill="#032621" />

    <!-- Central Diamond Spark (Setu Catalyst) -->
    <path
      d="M 256 236 L 264 256 L 284 264 L 264 272 L 256 292 L 248 272 L 228 264 L 248 256 Z"
      fill="#ffffff"
      opacity="0.95"
    />
  </g>

  <!-- Bottom Brand Subtitle on Icon -->
  <text x="256" y="476" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="7" fill="#e9c985" opacity="0.85">
    SAMASYASETU
  </text>
</svg>