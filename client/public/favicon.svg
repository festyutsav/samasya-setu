<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b514a" />
      <stop offset="100%" stop-color="#042a26" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e09e" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring with Gold Border -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="196" fill="#073f3a" stroke="#228b22" stroke-width="6" />

  <!-- Inner Off-White Medallion -->
  <circle cx="256" cy="256" r="160" fill="#fcfbf7" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Palash Flower Dots (Ring of 24) -->
  <g fill="#f97316" stroke="#c2410c" stroke-width="1.5">
    <circle cx="256" cy="76" r="8" />
    <circle cx="302" cy="82" r="8" />
    <circle cx="346" cy="100" r="8" />
    <circle cx="384" cy="128" r="8" />
    <circle cx="412" cy="166" r="8" />
    <circle cx="430" cy="210" r="8" />
    <circle cx="436" cy="256" r="8" />
    <circle cx="430" cy="302" r="8" />
    <circle cx="412" cy="346" r="8" />
    <circle cx="384" cy="384" r="8" />
    <circle cx="346" cy="412" r="8" />
    <circle cx="302" cy="430" r="8" />
    <circle cx="256" cy="436" r="8" />
    <circle cx="210" cy="430" r="8" />
    <circle cx="166" cy="412" r="8" />
    <circle cx="128" cy="384" r="8" />
    <circle cx="100" cy="346" r="8" />
    <circle cx="82" cy="302" r="8" />
    <circle cx="76" cy="256" r="8" />
    <circle cx="82" cy="210" r="8" />
    <circle cx="100" cy="166" r="8" />
    <circle cx="128" cy="128" r="8" />
    <circle cx="166" cy="100" r="8" />
    <circle cx="210" cy="82" r="8" />
  </g>

  <!-- Central Ashoka Stambh Emblem -->
  <!-- Lotus Pedestal -->
  <path d="M 216 328 C 236 316, 276 316, 296 328 C 286 340, 226 340, 216 328 Z" fill="url(#goldGrad)" stroke="#aa820a" stroke-width="2" />
  <!-- Abacus Drum -->
  <rect x="206" y="306" width="100" height="16" rx="4" fill="#0b514a" stroke="url(#goldGrad)" stroke-width="3" />
  <!-- Ashoka Chakra -->
  <circle cx="256" cy="314" r="7" fill="#000080" />
  <circle cx="256" cy="314" r="5" fill="#ffffff" />
  <circle cx="256" cy="314" r="2" fill="#000080" />

  <!-- Four Lions Silhouette in Rich Gold -->
  <!-- Left Lion -->
  <path d="M 206 306 C 192 278, 198 246, 224 234 C 224 254, 218 282, 224 306 Z" fill="url(#goldGrad)" stroke="#aa820a" stroke-width="2" />
  <!-- Right Lion -->
  <path d="M 306 306 C 320 278, 314 246, 288 234 C 288 254, 294 282, 288 306 Z" fill="url(#goldGrad)" stroke="#aa820a" stroke-width="2" />
  <!-- Front Center Lion Body & Mane -->
  <path d="M 226 306 C 226 266, 238 244, 256 226 C 274 244, 286 266, 286 306 Z" fill="#f8e5ad" stroke="url(#goldGrad)" stroke-width="3" />
  <!-- Lion Head & Crown -->
  <circle cx="256" cy="232" r="16" fill="url(#goldGrad)" stroke="#aa820a" stroke-width="2" />
  <circle cx="250" cy="228" r="2.5" fill="#042a26" />
  <circle cx="262" cy="228" r="2.5" fill="#042a26" />
  <path d="M 256 212 L 252 220 L 260 220 Z" fill="url(#goldGrad)" />

  <!-- Banner text ring "JHARKHAND" -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#0b514a" text-anchor="middle" letter-spacing="4">
    SAMASYA SETU
  </text>
  <text x="256" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c9933b" text-anchor="middle" letter-spacing="2">
    GOVT. OF JHARKHAND
  </text>
</svg>